name: CI

on:
  push:
  pull_request:

jobs:
  php:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: implementations/php
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, pdo_pgsql
          ini-values: memory_limit=512M
          coverage: none

      - name: Composer install
        run: composer install --no-interaction --no-progress

      - name: PHPStan (level max)
        run: vendor/bin/phpstan analyse --no-progress

      - name: PHPUnit
        run: vendor/bin/phpunit

      - name: Conformance fixtures against the in-memory core (strict)
        run: php runner/bin/run-fixtures.php --strict

      - name: Conformance fixtures against the database adapter (strict, SQLite)
        run: php runner/bin/run-fixtures.php --strict --subject=database

  node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: implementations/node
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Vitest
        run: pnpm test
      - name: Conformance fixtures against the in-memory core (strict)
        run: pnpm fixtures --strict
      - name: Conformance fixtures against the database adapter (strict, SQLite)
        run: pnpm fixtures --subject=database --strict

  # SF-15: shared database across the language boundary — PHP writes SQLite, Node reads.
  cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath
          coverage: none
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Composer install
        working-directory: implementations/php
        run: composer install --no-interaction --no-progress
      - name: pnpm install
        working-directory: implementations/node
        run: pnpm install --frozen-lockfile
      - name: PHP writes SQLite datasets (+ oracle)
        working-directory: implementations/php
        run: php runner/bin/cross-export.php --dir=${{ github.workspace }}/.cross-dbs
      - name: Node writes SQLite datasets (+ oracle)
        working-directory: implementations/node
        run: pnpm exec tsx runner/bin/cross-write.ts --dir=${{ github.workspace }}/.cross-dbs
      - name: PHP reads the Node databases (result as php-actual)
        working-directory: implementations/php
        run: php runner/bin/cross-read.php --dir=${{ github.workspace }}/.cross-dbs
      - name: Node compares journalExport in BOTH directions
        working-directory: implementations/node
        run: pnpm exec tsx runner/bin/cross-read.ts --dir=${{ github.workspace }}/.cross-dbs
