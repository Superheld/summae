name: Release notes

# Publishes the GitHub release for a `v*` tag, with the CHANGELOG section as its body.
#
# Why a workflow and not a step in RELEASING.md: releases v0.3.0 through v0.8.1 were tagged and
# published to npm and Packagist without any notes on GitHub — the CHANGELOG had them all along,
# nobody carried them over, and nothing said so. A documented manual step is exactly what was
# forgotten (the `branch-alias` bump went the same way). The notes now come from the file that has
# to be written anyway.
#
# It fails loudly on a missing CHANGELOG section rather than publishing an empty release: a tag
# without notes is what this workflow exists to prevent.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to write notes for (e.g. v0.9.1)'
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # The default branch, not the tag: on a tag push the two carry the same CHANGELOG
          # anyway (the tag is cut from it), while a manual run for an older tag would otherwise
          # check out a tree that predates this script — which is exactly how the first test of
          # this workflow failed.
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Extract the CHANGELOG section
        id: section
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          # Whether this tag gets the "Latest" badge is decided here, not by gh's default of
          # "whatever was published most recently". Backfilling the notes for v0.3.0..v0.8.1 in
          # that order handed the badge to 0.8.1 while 0.9.1 was long out, and the repo front
          # page said so for a day.
          newest=$(git tag --list 'v*' --sort=-v:refname | head -1)
          if [ "$tag" = "$newest" ]; then latest=true; else latest=false; fi
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "newest tag is $newest -> latest=$latest"

          ./bin/changelog-section.sh "$version" > /tmp/release-notes.md
          echo "--- notes ---"
          cat /tmp/release-notes.md

      - name: Publish or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.section.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            # Re-running must not clobber notes someone improved by hand, so only fill an empty one.
            if [ -z "$(gh release view "$tag" --json body -q .body)" ]; then
              gh release edit "$tag" --notes-file /tmp/release-notes.md
              echo "filled empty notes for $tag"
            else
              echo "$tag already has notes — left untouched"
            fi
          else
            gh release create "$tag" --title "${tag#v}" --notes-file /tmp/release-notes.md \
              --verify-tag --latest="${{ steps.section.outputs.latest }}"
          fi
