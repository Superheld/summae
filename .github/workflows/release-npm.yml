name: Release npm

# Publishes the public Node packages (@superheld/summae-core, -knex, -cli) to
# npmjs.com — `pnpm -r publish` in dependency order (runner is private).
# Trigger: git tag v* (e.g. v0.1.0) or manually.
# Requires the repository secret NPM_TOKEN (npm automation token with publish
# rights for the @superheld scope). Set once, turnkey after that:
# push a tag → CI builds and publishes.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run only (npm publish --dry-run)'
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: implementations/node
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Publish (core, knex, cli)
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            pnpm -r publish --dry-run --no-git-checks
          else
            pnpm -r publish --no-git-checks
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
